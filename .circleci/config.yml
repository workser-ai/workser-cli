version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19

jobs:
  verify:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Audit dependencies
          command: npm audit --audit-level=high
      - run:
          name: Test
          command: npm test

  publish:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Audit dependencies
          command: npm audit --audit-level=high
      - run:
          name: Publish package
          command: |
            printf '//registry.npmjs.org/:_authToken=${WORKSER_NPM}\n' > ~/.npmrc
            npm publish

workflows:
  verify-and-publish:
    jobs:
      - verify:
          filters:
            tags:
              only: /^v.*/
      - publish:
          requires:
            - verify
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
