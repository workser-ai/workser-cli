version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19

jobs:
  verify:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Audit dependencies
          command: npm audit --audit-level=high
      - run:
          name: Test
          command: npm test

  publish:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Publish newer package version
          command: |
            LOCAL_VERSION="$(node -p "require('./package.json').version")"
            PUBLISHED_VERSION="$(npm view @workser/cli version --registry=https://registry.npmjs.org 2>/dev/null || true)"

            if [ -n "$PUBLISHED_VERSION" ] && { [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ] || [ "$(printf '%s\\n%s\\n' "$PUBLISHED_VERSION" "$LOCAL_VERSION" | sort -V | tail -n 1)" != "$LOCAL_VERSION" ]; }; then
              echo "Skipping publish: local version $LOCAL_VERSION is not newer than npm version $PUBLISHED_VERSION."
              exit 0
            fi

            printf '//registry.npmjs.org/:_authToken=${WORKSER_NPM}\n' > ~/.npmrc
            npm publish

workflows:
  verify-and-publish:
    jobs:
      - verify:
      - publish:
          requires:
            - verify
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
