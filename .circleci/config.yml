version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19

jobs:
  verify:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Audit dependencies
          command: npm audit --audit-level=high
      - run:
          name: Test
          command: npm test

  publish:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Publish newer package version
          command: node scripts/publish-if-newer.mjs

workflows:
  verify-and-publish:
    jobs:
      - verify:
      - publish:
          requires:
            - verify
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
